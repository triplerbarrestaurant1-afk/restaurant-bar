backend:
  name: git-gateway
  branch: main

media_folder: "pictures & videos"
public_folder: "/pictures & videos"

collections:

  - name: "settings"
    label: "Restaurant Settings"
    files:
      - name: "content"
        label: "Contact & Hours"
        file: "_data/content.json"
        format: json
        fields:
          - label: "Phone Number"
            name: "phone"
            widget: "string"
            hint: "e.g. +590 690 69 10 98"
          - label: "Address (English)"
            name: "address_en"
            widget: "string"
          - label: "Address (French)"
            name: "address_fr"
            widget: "string"
          - label: "Opening Hours (English)"
            name: "hours_en"
            widget: "string"
          - label: "Opening Hours (French)"
            name: "hours_fr"
            widget: "string"
          - label: "Special Announcement"
            name: "announcement"
            widget: "string"
            required: false
            hint: "Optional — shows a banner on the homepage (leave empty to hide)"
          - label: "Revolut Payment Link"
            name: "revolut_link"
            widget: "string"
          - label: "Instagram URL"
            name: "instagram"
            widget: "string"
            required: false
          - label: "Facebook URL"
            name: "facebook"
            widget: "string"
            required: false
          - label: "TikTok URL"
            name: "tiktok"
            widget: "string"
            required: false
          - label: "WhatsApp Number"
            name: "whatsapp"
            widget: "string"
            required: false

      - name: "menu"
        label: "Menu Items"
        file: "_data/menu.json"
        format: json
        fields:
          - label: "Menu Items"
            name: "items"
            widget: "list"
            fields:
              - label: "Dish Name"
                name: "title"
                widget: "string"
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Starters", "Mains", "Crepes", "Desserts", "Cocktails", "Drinks", "Sandwiches", "Specials"]
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Price"
                name: "price"
                widget: "string"
                hint: "e.g. €12 or €8.50"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
              - label: "Available"
                name: "available"
                widget: "boolean"
                default: true

      - name: "blog"
        label: "Blog Posts"
        file: "_data/blog.json"
        format: json
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Date"
                name: "date"
                widget: "string"
                hint: "e.g. April 20, 2026"
              - label: "Category"
                name: "category"
                widget: "string"
                hint: "e.g. Culture, Gastronomy, Events"
              - label: "Cover Image"
                name: "image"
                widget: "image"
                required: false
              - label: "Summary"
                name: "summary"
                widget: "text"
              - label: "Full Content"
                name: "body"
                widget: "markdown"

      - name: "events"
        label: "Event Flyers"
        file: "_data/events.json"
        format: json
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            fields:
              - label: "Event Name"
                name: "title"
                widget: "string"
              - label: "Event Date"
                name: "date"
                widget: "string"
                hint: "e.g. Friday May 3, 2026"
              - label: "Flyer Image"
                name: "image"
                widget: "image"
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Active (show on site)"
                name: "active"
                widget: "boolean"
                default: true
