backend:
  name: git-gateway
  branch: main

media_folder: "pictures & videos"
public_folder: "/pictures & videos"

collections:

  - name: "settings"
    label: "Restaurant Settings"
    files:
      - name: "content"
        label: "Contact & Hours"
        file: "_data/content.json"
        format: json
        fields:
          - label: "Phone Number"
            name: "phone"
            widget: "string"
            hint: "e.g. +590 690 69 10 98"
          - label: "Address (English)"
            name: "address_en"
            widget: "string"
          - label: "Address (French)"
            name: "address_fr"
            widget: "string"
          - label: "Opening Hours (English)"
            name: "hours_en"
            widget: "string"
          - label: "Opening Hours (French)"
            name: "hours_fr"
            widget: "string"
          - label: "Special Announcement"
            name: "announcement"
            widget: "string"
            required: false
            hint: "Optional — shows a banner on the homepage (leave empty to hide)"
          - label: "Revolut Payment Link"
            name: "revolut_link"
            widget: "string"
          - label: "Instagram URL"
            name: "instagram"
            widget: "string"
            required: false
            hint: "e.g. https://instagram.com/triplerbar"
          - label: "Facebook URL"
            name: "facebook"
            widget: "string"
            required: false
          - label: "TikTok URL"
            name: "tiktok"
            widget: "string"
            required: false
          - label: "WhatsApp Number"
            name: "whatsapp"
            widget: "string"
            required: false
            hint: "e.g. +590690691098 (no spaces)"

  - name: "menu"
    label: "Menu Items"
    folder: "_data/menu"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Dish Name"
        name: "title"
        widget: "string"
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Starters", "Mains", "Crepes", "Desserts", "Cocktails", "Drinks", "Sandwiches", "Specials"]
      - label: "Description"
        name: "description"
        widget: "text"
        required: false
      - label: "Price"
        name: "price"
        widget: "string"
        hint: "e.g. €12 or €8.50"
      - label: "Photo"
        name: "image"
        widget: "image"
        required: false
      - label: "Available"
        name: "available"
        widget: "boolean"
        default: true

  - name: "blog"
    label: "Blog Posts"
    folder: "_data/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
      - label: "Cover Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Summary"
        name: "summary"
        widget: "text"
        hint: "Short description shown in the blog list"
      - label: "Content"
        name: "body"
        widget: "markdown"

  - name: "events"
    label: "Event Flyers"
    folder: "_data/events"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Event Name"
        name: "title"
        widget: "string"
      - label: "Event Date"
        name: "date"
        widget: "datetime"
      - label: "Flyer Image"
        name: "image"
        widget: "image"
      - label: "Description"
        name: "description"
        widget: "text"
        required: false
      - label: "Active (show on site)"
        name: "active"
        widget: "boolean"
        default: true
